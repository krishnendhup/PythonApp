name: Multi-Platform Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: hello_world
            artifact_path: dist/hello_world
            artifact_name: hello_world-linux
          - os: windows-latest
            binary: hello_world.exe
            artifact_path: dist/hello_world.exe
            artifact_name: hello_world-windows
          - os: macos-latest
            binary: hello_world
            artifact_path: dist/hello_world.dmg
            artifact_name: hello_world-macos-dmg

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Test Python script
      run: |
        python hello_world.py > output.txt
        grep -q "Hello, World!" output.txt || (echo "Test failed: Expected output not found" && exit 1)
        echo "✓ Python script test passed"

    - name: Build executable
      run: |
        pyinstaller --onefile --name hello_world hello_world.py
        ls -la dist/

    - name: Test executable
      run: |
        ./dist/${{ matrix.binary }} > test_output.txt
        grep -q "Hello, World!" test_output.txt || (echo "Test failed: Expected output not found" && exit 1)
        echo "✓ ${{ runner.os }} executable test passed"

    - name: Package DMG on macOS
      if: runner.os == 'macOS'
      run: |
        # hdiutil needs a source folder, so stage the binary in one
        mkdir -p dmg_src
        cp dist/hello_world dmg_src/
        hdiutil create -volname "Hello World" -srcfolder dmg_src -ov -format UDZO dist/hello_world.dmg

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_path }}
        if-no-files-found: error
