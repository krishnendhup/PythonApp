name: Multi-Platform Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: hello_world
            asset_name: hello_world-linux
          - os: windows-latest
            artifact_name: hello_world.exe
            asset_name: hello_world-windows.exe
          - os: macos-latest
            artifact_name: hello_world
            asset_name: hello_world-macos-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Test Python script
      run: |
        python hello_world.py > output.txt
        grep -q "Hello, World!" output.txt || (echo "Test failed: Expected output not found" && exit 1)
        echo "✓ Python script test passed"

    - name: Build on Linux
      if: runner.os == 'Linux'
      run: |
        pyinstaller --onefile --name hello_world hello_world.py
        mkdir -p dist
        ls -la dist/

    - name: Test Linux executable
      if: runner.os == 'Linux'
      run: |
        ./dist/hello_world > test_output.txt
        grep -q "Hello, World!" test_output.txt || (echo "Test failed: Expected output not found" && exit 1)
        echo "✓ Linux executable test passed"

    - name: Build on Windows
      if: runner.os == 'Windows'
      run: |
        pyinstaller --onefile --name hello_world hello_world.py
        dir dist\

    - name: Test Windows executable
      if: runner.os == 'Windows'
      run: |
        .\dist\hello_world.exe > test_output.txt
        findstr /C:"Hello, World!" test_output.txt || (echo Test failed: Expected output not found && exit 1)
        echo ✓ Windows executable test passed

    - name: Build on macOS
      if: runner.os == 'macOS'
      run: |
        pyinstaller --onefile --name hello_world hello_world.py
        ls -la dist/
        # Create DMG for macOS
        brew install create-dmg
        create-dmg --volname "Hello World" --window-pos 200 120 --window-size 800 600 --app-drop-link 750 250 "dist/hello_world.dmg" "dist/hello_world"

    - name: Test macOS executable
      if: runner.os == 'macOS'
      run: |
        ./dist/hello_world > test_output.txt
        grep -q "Hello, World!" test_output.txt || (echo "Test failed: Expected output not found" && exit 1)
        echo "✓ macOS executable test passed"

    - name: Upload Linux artifact
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: hello_world-linux
        path: dist/hello_world

    - name: Upload Windows artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: hello_world-windows
        path: dist/hello_world.exe

    - name: Upload macOS artifact
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: hello_world-macos-dmg
        path: dist/hello_world.dmg